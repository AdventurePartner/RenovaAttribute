# {name} 会替换为属性定义中的 display-name，第一捕获组必须是数值。
patterns:
  default: '^\s*{name}\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  base: '^\s*{name}\s*\[基础]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  flat: '^\s*{name}\s*\[固定]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  percent: '^\s*{name}\s*\[加成]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%\s*$'
  multiply: '^\s*{name}\s*\[乘算]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%\s*$'
