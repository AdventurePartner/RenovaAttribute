# 装备 Lore 属性匹配规则（Java 正则，整行匹配，大小写不敏感）。
# - {name} 会替换为属性定义中的 display-name（自动做正则转义）。
# - 正则的第一个捕获组必须是数值（支持正负号与小数）。
# - 冒号支持中英文写法 [:：]；匹配到第一条约定的规则即生效。
# - 规则与 ModifierMode 的对应关系：
#   default  无标签     -> 按属性定义的 lore-mode 计入
#   base     [基础] 标签 -> BASE 修饰（覆盖默认值层的贡献）
#   flat     [固定] 标签 -> FLAT 修饰（直接加值）
#   percent  [加成] 标签 -> PERCENT 修饰（乘以 1+值），必须带 %
#   multiply [乘算] 标签 -> MULTIPLY 修饰（乘以 1+值），必须带 %
# - 无标签/基础/固定 三种模式的 % 是可选的：仅在属性 lore-percent-value=true 时按百分比解读；
#   加成/乘算 两种模式强制要求 %（数值按百分比 ×0.01 计入）。
patterns:
  # 示例：物理伤害: 20 / 生命值：50
  default: '^\s*{name}\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  # 示例：生命值[基础]: 50
  base: '^\s*{name}\s*\[基础]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  # 示例：物理伤害[固定]: 20
  flat: '^\s*{name}\s*\[固定]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%?\s*$'
  # 示例：暴击率[加成]: 15%
  percent: '^\s*{name}\s*\[加成]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%\s*$'
  # 示例：伤害提升[乘算]: 20%
  multiply: '^\s*{name}\s*\[乘算]\s*[:：]\s*([+-]?\d+(?:\.\d+)?)\s*%\s*$'
