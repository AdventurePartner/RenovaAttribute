# RenovaAttribute 语言文件
# config.yml 的 language 指定使用哪个文件（不含 .yml）。复制本文件并改名（如 en_US.yml）即可新增语言，
# 缺少的键会回退到插件内置的同名文件，没有同名内置文件时回退到 zh_CN。
# 每条消息都可以写成字符串（单行）或列表（多行）；写成 '' 或 [] 则不发送。
# 支持 & 颜色代码；{prefix} 会替换为下方的 prefix，其余 {xxx} 占位符见各条消息。
prefix: '&6[RenovaAttribute] &r'
command:
  no-permission: '{prefix}&c没有权限执行该命令。'
  player-only: '{prefix}&c该命令只能由玩家执行。'
  reloaded: '{prefix}&a配置、属性定义与 Lore 规则已重新加载。'
  reload-failed: '{prefix}&c重载失败，请查看控制台。'
  # {label} 为玩家实际输入的命令名
  help:
    # 普通玩家（有 renovaattribute.info）
    player:
      - '&6RenovaAttribute &7命令帮助：'
      - '&e/{label} info [属性] &7- 查看自己的属性'
    # 管理员（有 renovaattribute.admin）
    admin:
      - '&6RenovaAttribute &7命令帮助：'
      - '&e/{label} info [属性] &7- 查看自己的属性'
      - '&e/{label} reload &7- 重载配置、属性定义与 Lore 规则'
      - '&e/{label} debug damage [玩家] &7- 开关玩家的伤害追踪'
  unknown-attribute: '{prefix}&c不存在属性：&f{attribute}'
  info-header: '&e{entity} &7的属性：'
  info-line: '&7- &f{name}&7: &a{value}'
  player-not-found: '{prefix}&c找不到在线玩家：&f{player}'
  debug-enabled: '{prefix}&a已开启 &f{player} &a的伤害追踪，再次执行同一命令即可关闭。'
  debug-disabled: '{prefix}&e已关闭 &f{player} &e的伤害追踪。'
debug:
  header: '&8[&6伤害追踪&8] &f{attacker} &7→ &f{defender} &8| &7{type} {cause} {source} &8| &7原始 &f{original} &7初始 &f{initial}'
  entry: '&8  P{priority} &e{handler} &8[{trigger}] &7值 &f{value} &8| &7{changes} &8| &7{micros}μs'
  entry-error: '&8  P{priority} &c{handler} &8[{trigger}] &c出错：{error}'
  result: '&8  &7结果 &f{outcome} &8| &7计算伤害 &f{damage} &8| &7实际扣血 &f{final} &8| &7真伤扣血 &f{true}'
  no-change: '无变化'
  labels:
    damage: '伤害'
    damage-boost: '增伤'
    crit-chance: '暴击率'
    crit-damage: '暴击伤害'
    critical: '暴击'
    defense: '防御'
    true-damage: '真伤'
    lifesteal: '吸血'
    cancelled: '取消'
