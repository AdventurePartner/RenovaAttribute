[versions]
kotlin = "2.0.21"
shadow = "8.3.6"
# core 编译下限：插件支持的最低服务端 API。
spigot-api-min = "1.20.1-R0.1-SNAPSHOT"
# compat-modern / compat-paper 编译上限：新 API 的实现。
spigot-api-latest = "1.21.10-R0.1-SNAPSHOT"
paper-api = "1.21.10-R0.1-SNAPSHOT"
# MythicMobs API 编译下限。5.6.2 与 5.13.0 发行版中本插件用到的签名完全一致；
# 开发包里 LumineUtils 的包名是 io.lumine.utils，发行版 relocate 到了
# io.lumine.mythic.bukkit.utils，由根工程 shadowJar 统一 relocate 对齐。
mythic = "5.6.2"
lumine-utils = "1.21-SNAPSHOT"
aycore = "1.4.5-BETA"
luaj = "3.0.1"
junit = "5.11.4"

[libraries]
spigot-api-min = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api-min" }
spigot-api-latest = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api-latest" }
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
mythic = { module = "io.lumine:Mythic", version.ref = "mythic" }
lumine-utils = { module = "io.lumine:LumineUtils", version.ref = "lumine-utils" }
aycore = { module = "com.aystudio.core:AyCore", version.ref = "aycore" }
luaj = { module = "org.luaj:luaj-jse", version.ref = "luaj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
